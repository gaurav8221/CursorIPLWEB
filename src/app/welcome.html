<div class="page">
  <header class="topbar">
    <div class="topbar-spacer"></div>

    <div class="menu">
      <button
        type="button"
        class="menu-button"
        (click)="toggleMenu()"
        aria-haspopup="true"
        [attr.aria-expanded]="isMenuOpen"
      >
        Menu
      </button>

      <nav class="menu-panel" *ngIf="isMenuOpen">
        <a class="menu-link" routerLink="/signup" (click)="closeMenu()">Sign Up</a>
        <a class="menu-link" routerLink="/login" (click)="closeMenu()">Login</a>
      </nav>
    </div>
  </header>

  <main class="content">
    <div class="welcome-text">Welcome to Cursor IPL 2026</div>
  </main>
</div>

<style>
  .page {
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
  }

  .topbar {
    position: relative;
    padding: 16px;
    display: flex;
    justify-content: flex-end;
  }

  .menu {
    position: relative;
  }

  .menu-button {
    border: 1px solid #ccc;
    background: #fff;
    padding: 8px 12px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
  }

  .menu-panel {
    position: absolute;
    top: calc(100% + 8px);
    right: 0;
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 8px;
    min-width: 140px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
    z-index: 10;
  }

  .menu-link {
    display: block;
    padding: 10px 12px;
    text-decoration: none;
    color: #111;
    border-radius: 8px;
  }

  .menu-link:hover {
    background: #f3f3f3;
  }

  .content {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .welcome-text {
    text-align: center;
    font-size: 20px;
    font-weight: bold;
  }
</style>
