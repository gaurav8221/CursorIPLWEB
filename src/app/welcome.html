<div class="page">
  <header class="topbar">
    <div class="brand">Cursor IPL 2026</div>

    <div class="menu">
      <button
        type="button"
        class="menu-button"
        (click)="toggleMenu()"
        aria-haspopup="true"
        [attr.aria-expanded]="isMenuOpen"
      >
        Menu
      </button>

      <nav class="menu-panel" *ngIf="isMenuOpen">
        <a class="menu-link" routerLink="/signup" (click)="closeMenu()">Sign Up</a>
        <a class="menu-link" routerLink="/login" (click)="closeMenu()">Login</a>
      </nav>
    </div>
  </header>

  <main class="content">
    <div class="welcome-text">Welcome to Cursor IPL 2026</div>
  </main>
</div>
