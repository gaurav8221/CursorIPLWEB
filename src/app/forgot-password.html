<div class="page">
  <header class="topbar">
    <div class="brand">Cursor IPL 2026</div>
    <div></div>
  </header>

  <main class="content">
    <div class="auth-card">
      <div class="auth-heading">Forgot Password</div>

      <form class="auth-form" (ngSubmit)="onSubmit()">
        <div class="auth-field">
          <label class="auth-label" for="email">Email</label>
          <input
            id="email"
            name="email"
            class="auth-input"
            type="email"
            autocomplete="email"
            [(ngModel)]="email"
            required
          />
        </div>

        <div class="auth-actions">
          <button type="submit" class="auth-button auth-button-primary">
            Submit
          </button>
          <button
            type="button"
            class="auth-button auth-button-secondary"
            (click)="onReset()"
          >
            Reset
          </button>
        </div>

        <div class="auth-footer">
          <a routerLink="/login" class="auth-link">Back to Login</a>
        </div>
      </form>
    </div>
  </main>
</div>
